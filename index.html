<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#edf1e9" />
  <meta name="description" content="Личная походная карта Уэльса: маршруты, интересные места, измерения и GPS." />
  <title>Wales Trail Atlas</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/trail.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./styles.css?v=5" />
  <script defer src="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.js"></script>
  <script defer src="./app.js?v=5"></script>
  <script defer src="./trip-planner.js?v=5"></script>
</head>
<body>
  <div id="map" role="application" aria-label="Интерактивная карта Уэльса"></div>
  <header class="brand glass">
    <span class="brand-icon" aria-hidden="true">⌁</span>
    <div class="brand-copy"><strong>Wales Trail Atlas</strong><small>OFFA'S DYKE · ПЛАН ПОХОДА</small></div>
    <span class="beta">BETA</span>
  </header>
  <nav class="map-tools" aria-label="Инструменты карты">
    <button id="locate" class="tool glass" title="Моё местоположение" aria-label="Моё местоположение">◎</button>
    <button id="add" class="tool glass" title="Добавить точку на карте" aria-label="Добавить точку">＋</button>
    <button id="measure" class="tool glass" title="Измерить по прямой" aria-label="Измерить расстояние">⌁</button>
    <button id="layers" class="tool glass" title="Фильтры точек" aria-label="Показать фильтры">▤</button>
  </nav>
  <div class="toolbar-hint glass" id="hint" hidden></div>
  <div class="filter-menu glass" id="filter-menu" hidden>
    <strong>Показать на карте</strong>
    <label><input type="checkbox" data-filter="town" checked> Населённые пункты</label>
    <label><input type="checkbox" data-filter="poi" checked> Интересные места</label>
    <label><input type="checkbox" data-filter="maybe" checked> Возможно посещу</label>
    <label><input type="checkbox" data-filter="night" checked> Ночёвки</label>
    <label><input type="checkbox" data-filter="supply" checked> Еда и вода</label>
    <label><input type="checkbox" data-filter="transport" checked> Транспорт</label>
  </div>
  <aside class="status-bar glass" aria-live="polite">
    <div class="status-top"><span class="status-dot"></span><span id="route-label">МАРШРУТ ЕЩЁ НЕ ЗАГРУЖЕН</span></div>
    <div class="stat-row">
      <div><strong id="route-distance">—</strong><small>Трек</small></div>
      <div><strong id="route-ascent">—</strong><small>Набор высоты</small></div>
      <div><strong id="route-time">—</strong><small>Время ходьбы</small></div>
    </div>
    <p id="route-note">Пунктирная линия — только схема между городами, не тропа. Импортируй GPX для точного маршрута.</p>
    <div class="status-actions"><button id="import-gpx" class="primary">↑ Импорт GPX</button><button id="open-list" class="secondary">Места <span id="point-count">0</span></button><button id="open-stages" class="secondary">Дни <span id="stage-count">—</span></button></div>
  </aside>
  <button id="trip-current" class="trip-current glass" hidden></button>
  <div id="trip-hint" class="trip-edit-hint glass" hidden></div>
  <button id="trip-cancel" class="trip-cancel glass" hidden>Отмена</button>
  <button id="menu-open" class="more-button glass" title="Импорт, экспорт, добавление по ссылке" aria-label="Открыть меню">⋯</button>
  <div class="backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-handle"></div>
    <header class="sheet-head"><h2 id="sheet-title">Места</h2><button id="sheet-close" aria-label="Закрыть">×</button></header>
    <div id="sheet-content" class="sheet-content"></div>
  </section>
  <input type="file" id="gpx-file" accept=".gpx,.xml,application/gpx+xml,text/xml" hidden />
  <input type="file" id="backup-file" accept=".json,application/json" hidden />
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="no-script">Для работы карты нужен JavaScript.</p></noscript>
</body>
</html>
