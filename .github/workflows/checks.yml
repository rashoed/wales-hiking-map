name: Wales Atlas checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  planner-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check app.js
          node --check trip-planner.js
          node --check sw.js
      - name: Run planner tests
        run: node --test tests/planner.test.cjs
